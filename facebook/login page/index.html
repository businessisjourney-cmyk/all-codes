
<!DOCTYPE html>
<html>
<head>
    <title>Facebook Login Page</title>
 <link rel="stylesheet" href="login.css">
  </head>

<body>

    <div class="main">

        <div class="left">
            <div class="logo">f</div>

            <h1>
                Explore<br>
                the things<br>
                <span class="blue">you love.</span>
            </h1>
        </div>

        <div class="right">
            <div class="login">

                <h3>Log in to Facebook</h3>

                </form>

                <div class="forgot">
                    <a href="#">Forgotten password?</a>
                </div>
<a href="create account.html">
     <button class="create" type="button">
                    Create new account
                </button>

</a>
               
                <div class="meta">
                    🔵 Meta
                </div>

            </div>
        </div>

    </div>

</body>
</html>
